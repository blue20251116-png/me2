<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 영문 타래</title>
<link rel="stylesheet" href="/style.css">
<style>
  .xd-wrap{max-width:720px;margin:0 auto;padding:16px}
  .xd-card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(120,90,160,.12);padding:14px;margin:12px 0}
  .xd-tw{white-space:pre-wrap;border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0;font-size:14px;line-height:1.5}
  .xd-meta{font-size:12px;color:#888;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .xd-cnt{font-size:11px;color:#999;text-align:right}
  .xd-cnt.over{color:#e11d48;font-weight:700}
  .xd-btn{border:0;border-radius:999px;padding:6px 12px;background:linear-gradient(135deg,#f472b6,#a78bfa);color:#fff;font-weight:600;cursor:pointer}
  .xd-btn.ghost{background:#f3eefc;color:#6b4fa0}
  .xd-badge{border-radius:999px;padding:2px 8px;background:#f3eefc;color:#6b4fa0;font-weight:600}
  select{padding:6px 10px;border-radius:10px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="xd-wrap">
  <h2>𝕏 영문 타래 (해외 트랙)</h2>
  <p class="xd-meta">스레드 글이 생성될 때 같이 만들어진 X용 영문 타래예요. 링크는 자동으로 제거되고, 마지막 트윗에 고정 트윗/바이오 안내 문구가 붙어 있어요.</p>
  <p><select id="acc"></select> <a href="/" class="xd-btn ghost" style="text-decoration:none">← 대시보드</a></p>
  <div id="list">불러오는 중…</div>
</div>
<script>
function xLen(s){let n=0;for(const ch of s){const c=ch.codePointAt(0);n+=(c<=4351||(c>=8192&&c<=8205)||(c>=8208&&c<=8223)||(c>=8242&&c<=8247))?1:2}return n}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const o=btn.textContent;btn.textContent='복사됨';setTimeout(()=>btn.textContent=o,1200)}
const STATUS={draft:'대기',published:'X 자동발행됨',manual:'직접 올림',failed:'실패'};
async function load(){
  const id=document.getElementById('acc').value;const box=document.getElementById('list');
  const r=await fetch('/api/x-drafts?accountId='+encodeURIComponent(id));
  if(!r.ok){box.textContent='불러오기 실패 ('+r.status+')';return}
  const rows=await r.json();box.textContent='';
  if(!rows.length){box.textContent='아직 생성된 X 타래가 없어요. 서버 환경변수 X_TRACK_ENABLED=1 인지 확인하세요.';return}
  for(const d of rows){
    const card=el('div','xd-card');
    const meta=el('div','xd-meta');
    meta.append(el('span','xd-badge',STATUS[d.status]||d.status),el('span',null,'스레드 글 #'+d.post_id+' · '+(d.threads_status==='posted'?'스레드 발행됨':'스레드 예약중')),el('span',null,(d.created_at||'').replace('T',' ').slice(0,16)));
    if(d.error_message)meta.append(el('span',null,'⚠ '+d.error_message));
    card.append(meta);
    d.tweets.forEach((t,i)=>{
      const tw=el('div','xd-tw',t);card.append(tw);
      const n=xLen(t);const c=el('div','xd-cnt'+(n>260?' over':''),(i+1)+'/'+d.tweets.length+' · '+n+'/260');card.append(c);
      const b=el('button','xd-btn ghost','이 트윗 복사');b.onclick=()=>copy(t,b);card.append(b);
    });
    const row=el('p');const all=el('button','xd-btn','전체 복사');all.onclick=()=>copy(d.tweets.join('\n\n---\n\n'),all);row.append(all);
    if(d.status==='draft'){const m=el('button','xd-btn ghost','직접 올렸어요');m.style.marginLeft='8px';m.onclick=async()=>{await fetch('/api/x-drafts/'+d.id+'/copied?accountId='+encodeURIComponent(id),{method:'POST'});load()};row.append(m)}
    card.append(row);box.append(card);
  }
}
(async()=>{
  const r=await fetch('/api/accounts');const accs=r.ok?await r.json():[];const s=document.getElementById('acc');
  for(const a of accs){const o=document.createElement('option');o.value=a.id;o.textContent=a.label+(a.threads_username?' (@'+a.threads_username+')':'');s.append(o)}
  s.onchange=load;if(accs.length)load();else document.getElementById('list').textContent='계정이 없어요.';
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알림</title>
<link rel="stylesheet" href="style.css" />
<style>
  .status-shell { max-width: 380px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; text-align: center; }
  .status-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; }
  .status-icon { font-size: 32px; margin-bottom: 12px; }
  .status-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  .status-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
</style>
</head>
<body style="margin:0; background: var(--bg);">
  <div class="status-shell">
    <div class="status-card">
      <div class="status-icon" id="statusIcon">⏳</div>
      <h1 class="status-title" id="statusTitle">확인 중…</h1>
      <p class="status-sub" id="statusSub"></p>
      <a href="/login.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">로그인 화면으로</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const status = params.get('status');
    const map = {
      pending: { icon: '⏳', title: '관리자 승인 대기 중입니다.', sub: '승인이 완료되면 로그인하실 수 있어요.' },
      suspended: { icon: '🚫', title: '이용이 중지된 계정입니다.', sub: '문의가 필요하시면 운영자에게 연락해주세요.' },
      expired: { icon: '⌛', title: '이용기간이 만료되었습니다.', sub: '이용 연장이 필요하시면 운영자에게 문의해주세요.' },
    };
    const info = map[status] || { icon: '❓', title: '접근할 수 없습니다.', sub: '' };
    document.getElementById('statusIcon').textContent = info.icon;
    document.getElementById('statusTitle').textContent = info.title;
    document.getElementById('statusSub').textContent = info.sub;
  </script>
</body>
</html>

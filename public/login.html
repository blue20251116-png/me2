<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인</title>
<link rel="stylesheet" href="style.css" />
<style>
  .auth-shell { max-width: 380px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  .auth-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .auth-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
  .auth-card form { display: flex; flex-direction: column; gap: 12px; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 16px; }
  .auth-switch a { color: var(--amber); text-decoration: none; }
</style>
</head>
<body style="margin:0; background: var(--bg);">
  <div class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">로그인</h1>
      <p class="auth-sub">스레드 자동발행 대시보드</p>
      <form id="loginForm">
        <label>이메일<input type="email" name="email" required /></label>
        <label>비밀번호<input type="password" name="password" required /></label>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <p id="loginMsg" class="msg"></p>
      <p class="auth-switch">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
      <p id="adminSetupLink" class="auth-switch" style="display:none;"><a href="/admin-setup.html">최초 관리자 설정</a></p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('loginMsg');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, password: form.password.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        location.href = data.role === 'admin' ? '/admin' : '/';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
      }
    });

    fetch('/api/auth/admin-setup-status')
      .then((r) => r.json())
      .then((data) => {
        if (data.needsSetup) document.getElementById('adminSetupLink').style.display = 'block';
      })
      .catch(() => {});
  </script>
</body>
</html>

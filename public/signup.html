<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입</title>
<link rel="stylesheet" href="style.css" />
<style>
  .auth-shell { max-width: 420px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  .auth-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .auth-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
  .auth-card form { display: flex; flex-direction: column; gap: 12px; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 16px; }
  .auth-switch a { color: var(--amber); text-decoration: none; }
  .pay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .pay-row { font-size: 13px; margin: 6px 0; }
  .pay-row .l { color: var(--text-dim); }
  .pay-guide { font-size: 12.5px; color: var(--text-dim); white-space: pre-wrap; margin-top: 10px; line-height: 1.6; }
  .pay-kakao { display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 8px; background: #FEE500; color: #000; font-size: 13px; font-weight: 600; text-decoration: none; }
  .plan-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; margin: 0 0 12px; }
  .plan-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .plan-option { border:2px solid var(--border); border-radius:14px; padding:14px; cursor:pointer; background:var(--surface-2); transition:.15s ease; }
  .plan-option input { display:none; }
  .plan-option.selected { border-color:#ff4f87; box-shadow:0 0 0 3px rgba(255,79,135,.08); }
  .plan-name { font-weight:800; font-size:15px; }
  .plan-price { font-family:var(--font-display); font-weight:800; font-size:19px; color:#ff4f87; margin-top:5px; }
  .plan-desc { color:var(--text-dim); font-size:11.5px; line-height:1.55; margin-top:6px; }
  .threads-help { font-size:11.5px; color:var(--text-dim); line-height:1.55; margin-top:-5px; }
</style>
</head>
<body style="margin:0; background: var(--bg);">
  <div class="auth-shell">
    <div class="pay-card" id="payCard">
      <p class="plan-title">이용 요금</p>
      <div class="plan-grid" id="planGrid">
        <label class="plan-option selected" data-plan="basic">
          <input type="radio" name="planChoice" value="basic" checked />
          <div class="plan-name">베이직</div>
          <div class="plan-price">20,000원 / 월</div>
          <div class="plan-desc">Threads 1계정<br>하루 최대 15개 발행</div>
        </label>
        <label class="plan-option" data-plan="pro">
          <input type="radio" name="planChoice" value="pro" />
          <div class="plan-name">프로</div>
          <div class="plan-price">50,000원 / 월</div>
          <div class="plan-desc">Threads 2계정<br>하루 최대 50개 발행</div>
        </label>
      </div>
      <div class="pay-row"><span class="l">입금 계좌</span> <span id="payBank"></span></div>
      <p class="pay-guide" id="payGuide"></p>
      <a href="#" id="payKakaoLink" class="pay-kakao hidden">오픈카톡으로 입금 확인 보내기</a>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">가입 후 관리자 승인이 필요합니다</p>
      <form id="signupForm">
        <label>이름<input type="text" name="display_name" required /></label>
        <label>스레드 아이디<input type="text" name="threads_ids" id="threadsIds" required placeholder="예: 1234oo" /></label>
        <p class="threads-help" id="threadsHelp">자동화로 사용할 Threads 아이디를 적어주세요. 베이직은 1개만 등록할 수 있습니다.</p>
        <label>이메일<input type="email" name="email" required /></label>
        <label>비밀번호<input type="password" name="password" required minlength="8" /></label>
        <button type="submit" class="btn-primary">가입 신청</button>
      </form>
      <p id="signupMsg" class="msg"></p>
      <p class="auth-switch">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
    </div>
  </div>
  <script>
    let selectedPlan = 'basic';
    function updatePlanUI(plan) {
      selectedPlan = plan;
      document.querySelectorAll('.plan-option').forEach(el => el.classList.toggle('selected', el.dataset.plan === plan));
      const input = document.querySelector(`input[name="planChoice"][value="${plan}"]`);
      if (input) input.checked = true;
      const ids = document.getElementById('threadsIds');
      const help = document.getElementById('threadsHelp');
      if (plan === 'pro') {
        ids.placeholder = '예: 1234oo,qtwg124';
        help.textContent = '자동화로 사용할 Threads 아이디를 적어주세요. 2개면 쉼표로 구분해 주세요. 예) 1234oo,qtwg124';
      } else {
        ids.placeholder = '예: 1234oo';
        help.textContent = '자동화로 사용할 Threads 아이디를 적어주세요. 베이직은 1개만 등록할 수 있습니다.';
      }
    }
    document.querySelectorAll('.plan-option').forEach(el => el.addEventListener('click', () => updatePlanUI(el.dataset.plan)));

    async function loadPaymentInfo() {
      try {
        const res = await fetch('/api/site-settings');
        const data = await res.json();
        document.getElementById('payBank').textContent = data.bank_info;
        document.getElementById('payGuide').textContent = '가입 신청 후 선택한 요금제 금액을 위 계좌로 입금해주세요.\n입금 후 오픈카톡으로 "입금자명 + 스레드 아이디"를 보내주시면 확인 후 승인해드립니다.\n현금영수증이 필요하시면 발행에 필요한 정보를 이메일로 보내주세요.';
        if (data.open_kakao_url) {
          const link = document.getElementById('payKakaoLink');
          link.href = data.open_kakao_url;
          link.target = '_blank';
          link.classList.remove('hidden');
        }
      } catch {
        document.getElementById('payBank').textContent = '결제 안내를 불러오지 못했어요';
      }
    }
    loadPaymentInfo();

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('signupMsg');
      try {
        const ids = [...new Set(String(form.threads_ids.value || '').split(',').map(v => v.trim().replace(/^@/, '')).filter(Boolean))];
        const max = selectedPlan === 'pro' ? 2 : 1;
        if (!ids.length) throw new Error('자동화로 사용할 Threads 아이디를 입력해주세요.');
        if (ids.length > max) throw new Error(selectedPlan === 'pro' ? '프로는 Threads 아이디를 최대 2개까지 등록할 수 있습니다.' : '베이직은 Threads 아이디를 1개만 등록할 수 있습니다.');
        const encodedName = `${form.display_name.value.trim()}||PLAN:${selectedPlan}||THREADS:${ids.join(',')}`;
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: encodedName, email: form.email.value, password: form.password.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        msg.textContent = `${selectedPlan === 'pro' ? '프로' : '베이직'} 가입 신청 완료 · 관리자 승인 후 이용 가능합니다.`;
        msg.className = 'msg';
        form.reset();
        updatePlanUI('basic');
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자</title>
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-top h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
  .stat-box .n { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .stat-box .l { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .user-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .user-email { font-size: 13.5px; font-weight: 600; }
  .user-name { font-size: 11.5px; color: var(--text-dim); }
  .user-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; font-family: var(--font-mono); }
  .user-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .user-actions button { font-size: 11.5px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
  .badge { font-size: 10px; font-family: var(--font-mono); padding: 2px 7px; border-radius: 999px; }
  .badge.pending { color: var(--amber); background: rgba(245,166,35,0.12); }
  .badge.active { color: var(--green); background: rgba(52,211,153,0.12); }
  .badge.suspended { color: var(--red); background: rgba(240,101,90,0.12); }
  .settings-form { display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .settings-form label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--text-dim); }
</style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top"><h1>관리자</h1><a href="/" style="color: var(--text-dim); font-size: 12.5px;">← 대시보드로</a></div>
    <div class="stat-row"><div class="stat-box"><div class="n" id="statTotal">–</div><div class="l">전체 회원</div></div><div class="stat-box"><div class="n" id="statPending">–</div><div class="l">승인 대기</div></div><div class="stat-box"><div class="n" id="statActive">–</div><div class="l">활성</div></div><div class="stat-box"><div class="n" id="statSuspended">–</div><div class="l">정지</div></div></div>
    <div id="userList"></div>
    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">서비스 공용 API 설정</h2>
    <form id="systemApiForm" class="settings-form"><p style="font-size:12.5px;color:var(--text-dim);margin:0;">여기에 입력한 값은 모든 회원이 공용으로 사용합니다.</p><label>Threads App ID<input type="text" name="threads_app_id" /></label><label>Threads App Secret<input type="password" name="threads_app_secret" /></label><label>Meta Callback / Redirect URI<input type="url" name="threads_redirect_uri" /></label><label>OpenAI API Key<input type="password" name="openai_api_key" /></label><label>네이버 데이터랩 Client ID<input type="text" name="naver_client_id" /></label><label>네이버 데이터랩 Client Secret<input type="password" name="naver_client_secret" /></label><label>YouTube Data API Key<input type="password" name="youtube_api_key" /></label><button type="submit">공용 API 저장</button><p id="systemApiStatus"></p><p id="systemApiMsg"></p></form>
    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">레시피 이미지 API 설정</h2>
    <form id="recipeImageApiForm" class="settings-form"><label>Pexels API Key<input type="password" name="pexels_api_key" /></label><label>Pixabay API Key<input type="password" name="pixabay_api_key" /></label><button type="submit">레시피 이미지 API 저장</button><p id="recipeImageApiStatus"></p><p id="recipeImageApiMsg"></p></form>
    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">회원가입 화면에 보일 결제 안내</h2>
    <form id="siteSettingsForm" class="settings-form"><label>요금 표시<input type="text" name="price_label" /></label><label>입금 계좌<input type="text" name="bank_info" /></label><label>오픈카톡 링크<input type="text" name="open_kakao_url" /></label><label>현금영수증 문의 이메일<input type="email" name="tax_email" /></label><label>안내 문구<textarea name="payment_guide" rows="4"></textarea></label><button type="submit">저장</button><p id="siteSettingsMsg"></p></form>
  </div>
<script>
function fmt(iso){return iso?new Date(iso).toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric'}):'없음'}
async function loadUsers(){const res=await fetch('/api/admin/users');if(res.status===403){document.body.innerHTML='<p>관리자만 접근할 수 있습니다.</p>';return}const users=await res.json();statTotal.textContent=users.length;statPending.textContent=users.filter(u=>u.status==='pending').length;statActive.textContent=users.filter(u=>u.status==='active').length;statSuspended.textContent=users.filter(u=>u.status==='suspended').length;userList.innerHTML=users.map(u=>`<div class="user-card"><div class="user-top"><div><span class="user-email">${u.email}</span> <span class="user-name">${u.name||''}</span></div><span class="badge ${u.status}">${u.status}</span></div><div class="user-meta">가입 ${fmt(u.created_at)} · 만료 ${fmt(u.expires_at)}</div><div class="user-actions">${u.status==='pending'?`<button data-action="approve" data-id="${u.id}">승인</button>`:''}${u.status==='active'?`<button data-action="suspend" data-id="${u.id}">정지</button>`:''}${u.status==='suspended'?`<button data-action="unsuspend" data-id="${u.id}">정지 해제</button>`:''}${u.role!=='admin'?`<button data-action="grant30" data-id="${u.id}">30일 부여</button>`:''}</div></div>`).join('');document.querySelectorAll('.user-actions button').forEach(btn=>btn.onclick=async()=>{const map={approve:'approve',suspend:'suspend',unsuspend:'unsuspend',grant30:'grant'};await fetch(`/api/admin/users/${btn.dataset.id}/${map[btn.dataset.action]}`,{method:'POST',headers:{'Content-Type':'application/json'},body:btn.dataset.action==='grant30'?JSON.stringify({days:30}):undefined});loadUsers()})}
async function loadSiteSettings(){const r=await fetch('/api/admin/site-settings'),d=await r.json(),f=siteSettingsForm;f.price_label.value=d.price_label||'';f.bank_info.value=d.bank_info||'';f.open_kakao_url.value=d.open_kakao_url||'';f.tax_email.value=d.tax_email||'';f.payment_guide.value=d.payment_guide||'';recipeImageApiStatus.textContent=`Pexels ${d.has_pexels_api_key?'✓ 저장됨':'✕ 미설정'} · Pixabay ${d.has_pixabay_api_key?'✓ 저장됨':'✕ 미설정'}`}
async function loadSystem(){const r=await fetch('/api/admin/system-api-settings');if(!r.ok)return;const d=await r.json(),f=systemApiForm;f.threads_app_id.value=d.threads_app_id||'';f.threads_redirect_uri.value=d.threads_redirect_uri||'';f.naver_client_id.value=d.naver_client_id||'';systemApiStatus.textContent=`Threads Secret ${d.has_threads_app_secret?'✓':'✕'} · OpenAI ${d.has_openai_api_key?'✓':'✕'} · YouTube ${d.has_youtube_api_key?'✓':'✕'}`}
siteSettingsForm.onsubmit=async e=>{e.preventDefault();const f=e.target;await fetch('/api/admin/site-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price_label:f.price_label.value,bank_info:f.bank_info.value,open_kakao_url:f.open_kakao_url.value,tax_email:f.tax_email.value,payment_guide:f.payment_guide.value})});siteSettingsMsg.textContent='저장 완료'};
recipeImageApiForm.onsubmit=async e=>{e.preventDefault();const f=e.target,p={};if(f.pexels_api_key.value.trim())p.pexels_api_key=f.pexels_api_key.value.trim();if(f.pixabay_api_key.value.trim())p.pixabay_api_key=f.pixabay_api_key.value.trim();await fetch('/api/admin/site-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});f.reset();recipeImageApiMsg.textContent='저장 완료';loadSiteSettings()};
systemApiForm.onsubmit=async e=>{e.preventDefault();const f=e.target;const r=await fetch('/api/admin/system-api-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threads_app_id:f.threads_app_id.value,threads_app_secret:f.threads_app_secret.value,threads_redirect_uri:f.threads_redirect_uri.value,openai_api_key:f.openai_api_key.value,naver_client_id:f.naver_client_id.value,naver_client_secret:f.naver_client_secret.value,youtube_api_key:f.youtube_api_key.value})});systemApiMsg.textContent=r.ok?'공용 API 설정 저장 완료':'저장 실패';f.threads_app_secret.value='';f.openai_api_key.value='';f.naver_client_secret.value='';f.youtube_api_key.value='';loadSystem()};
loadUsers();loadSiteSettings();loadSystem();
</script>
<script src="benchmarkAdmin.js"></script>
</body></html>

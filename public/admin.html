<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자</title>
<link rel="stylesheet" href="style.css" />
<style>
.admin-wrap{max-width:900px;margin:0 auto;padding:18px 14px 70px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.admin-top h1{font-family:var(--font-display);font-size:19px;margin:0}.admin-tabs{display:flex;gap:6px;position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 12px}.admin-tab{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);border-radius:10px;padding:10px 8px;font-weight:700;cursor:pointer}.admin-tab.active{color:var(--text);border-color:#ff4f87;box-shadow:0 0 0 1px #ff4f87 inset}.tab-panel{display:none}.tab-panel.active{display:block}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:5px 0 12px}.stat-box{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 5px;text-align:center;cursor:pointer}.stat-box.active{border-color:#ff4f87;background:#fff7fb}.stat-box .n{font-family:var(--font-mono);font-size:19px;font-weight:800}.stat-box .l{font-size:10.5px;color:var(--text-dim)}.admin-search{width:100%;box-sizing:border-box;margin-bottom:10px}.list-head{font-size:12px;color:var(--text-dim);margin:4px 1px 8px}.user-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden}.user-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;cursor:pointer}.user-main{min-width:0}.user-email{font-size:13.5px;font-weight:700;word-break:break-all}.user-name,.user-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}.summary-right{display:flex;align-items:center;gap:7px;flex-shrink:0}.badge{font-size:10.5px;padding:3px 7px;border-radius:999px;font-weight:700}.badge.pending{color:var(--amber);background:rgba(245,166,35,.12)}.badge.active{color:var(--green);background:rgba(52,211,153,.12)}.badge.suspended,.badge.expired{color:var(--red);background:rgba(240,101,90,.12)}.manage-arrow{font-size:12px;color:var(--text-dim)}.user-detail{display:none;border-top:1px solid var(--border);padding:12px;background:var(--surface-2)}.user-card.open .user-detail{display:block}.section-label{font-size:11px;color:var(--text-dim);font-weight:700;margin:11px 0 6px}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.action-row{display:flex;gap:6px;flex-wrap:wrap}.admin-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 10px;font-size:11.5px;font-weight:700;cursor:pointer}.admin-btn.primary{border-color:#ff4f87}.admin-btn.danger{color:var(--red)}.day-input{width:82px}.expiry-preview{font-size:11.5px;color:var(--text-dim);margin-top:7px}.settings-form{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}.settings-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-dim)}.settings-title{font-family:var(--font-display);font-size:15px;margin:18px 0 8px}.temp-password{margin-top:8px;padding:9px 10px;background:var(--surface);border:1px dashed var(--border);border-radius:8px;font-family:var(--font-mono);font-size:12px}.empty{padding:30px 10px;text-align:center;color:var(--text-dim);font-size:12px}@media(max-width:520px){.admin-wrap{padding:12px 10px 60px}.stat-row{gap:5px}.stat-box{padding:8px 3px}.stat-box .n{font-size:17px}.user-summary{padding:10px}.action-grid{grid-template-columns:1fr 1fr}.admin-tabs{top:0}}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-top"><h1>관리자</h1><a href="/" style="color:var(--text-dim);font-size:12.5px">← 대시보드</a></div>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="members">회원 관리</button>
    <button class="admin-tab" data-tab="benchmark">벤치마킹</button>
    <button class="admin-tab" data-tab="api">API 설정</button>
  </div>

  <section id="tab-members" class="tab-panel active">
    <div class="stat-row">
      <button class="stat-box active" data-status="all"><div class="n" id="statTotal">–</div><div class="l">전체 회원</div></button>
      <button class="stat-box" data-status="pending"><div class="n" id="statPending">–</div><div class="l">승인 대기</div></button>
      <button class="stat-box" data-status="active"><div class="n" id="statActive">–</div><div class="l">이용중</div></button>
      <button class="stat-box" data-status="suspended"><div class="n" id="statSuspended">–</div><div class="l">정지</div></button>
    </div>
    <input id="memberSearch" class="admin-search" placeholder="이름 · 이메일 · Threads ID 검색" />
    <div id="memberListHead" class="list-head"></div>
    <div id="userList"></div>
  </section>

  <section id="tab-benchmark" class="tab-panel"><div id="benchmarkPanel"></div></section>

  <section id="tab-api" class="tab-panel">
    <h2 class="settings-title">서비스 공용 API 설정</h2>
    <form id="systemApiForm" class="settings-form"><p style="font-size:12.5px;color:var(--text-dim);margin:0">모든 회원이 공용으로 사용하는 API입니다.</p><label>Threads App ID<input type="text" name="threads_app_id" /></label><label>Threads App Secret<input type="password" name="threads_app_secret" /></label><label>Meta Callback / Redirect URI<input type="url" name="threads_redirect_uri" /></label><label>OpenAI API Key<input type="password" name="openai_api_key" /></label><label>네이버 데이터랩 Client ID<input type="text" name="naver_client_id" /></label><label>네이버 데이터랩 Client Secret<input type="password" name="naver_client_secret" /></label><label>YouTube Data API Key<input type="password" name="youtube_api_key" /></label><button type="submit">공용 API 저장</button><p id="systemApiStatus"></p><p id="systemApiMsg"></p></form>
    <h2 class="settings-title">레시피 이미지 API 설정</h2>
    <form id="recipeImageApiForm" class="settings-form"><label>Pexels API Key<input type="password" name="pexels_api_key" /></label><label>Pixabay API Key<input type="password" name="pixabay_api_key" /></label><button type="submit">레시피 이미지 API 저장</button><p id="recipeImageApiStatus"></p><p id="recipeImageApiMsg"></p></form>
    <h2 class="settings-title">회원가입 결제 안내</h2>
    <form id="siteSettingsForm" class="settings-form"><label>요금 표시<input type="text" name="price_label" /></label><label>입금 계좌<input type="text" name="bank_info" /></label><label>오픈카톡 링크<input type="text" name="open_kakao_url" /></label><label>현금영수증 문의 이메일<input type="email" name="tax_email" /></label><label>안내 문구<textarea name="payment_guide" rows="4"></textarea></label><button type="submit">저장</button><p id="siteSettingsMsg"></p></form>
  </section>
</div>
<script>
let allUsers=[],activeStatus='all';
const $=id=>document.getElementById(id);
function fmt(iso){return iso?new Date(iso).toLocaleDateString('ko-KR'):'없음'}
function parseSignupName(raw){const s=String(raw||'');const plan=(s.match(/\|\|PLAN:(basic|pro)\|\|/i)?.[1]||'').toLowerCase();const threads=s.match(/\|\|THREADS:([^|]*)/i)?.[1]||'';const name=s.split('||PLAN:')[0]||s;return{name,plan,threads};}
function effectiveStatus(u){return u.status==='active'&&u.expires_at&&new Date(u.expires_at)<new Date()?'expired':u.status}
function statusLabel(s){return({pending:'승인 대기',active:'이용중',suspended:'정지',expired:'만료'})[s]||s}
async function postJson(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'처리 실패');return d}
async function applyPlan(id,plan){const label=plan==='pro'?'프로':'베이직';if(!confirm(`${label} 권한으로 변경할까요?`))return;await postJson(`/api/admin/users/${id}/grant`,{days:plan==='pro'?91002:91001});await loadUsers()}
async function adjustDays(id,days){if(!Number.isFinite(days)||days===0||days<-3650||days>3650){alert('-3650~3650 사이의 0이 아닌 일수를 입력해주세요');return}if(!confirm(`이용기간을 ${days>0?'+':''}${days}일 조정할까요?`))return;await postJson(`/api/admin/users/${id}/grant`,{days});await loadUsers()}
async function resetPassword(id,box){if(!confirm('이 회원의 비밀번호를 임시 비밀번호로 초기화할까요?\n기존 비밀번호는 즉시 사용할 수 없게 됩니다.'))return;try{const d=await postJson(`/api/admin/users/${id}/reset-password`,{});box.innerHTML=`임시 비밀번호 <b>${d.temporary_password}</b> <button class="admin-btn" type="button">복사</button>`;box.querySelector('button').onclick=()=>navigator.clipboard.writeText(d.temporary_password)}catch(e){alert(e.message)}}
function renderUsers(){const q=$('memberSearch').value.trim().toLowerCase();const users=allUsers.filter(u=>{const p=parseSignupName(u.name);const st=effectiveStatus(u);const statusOk=activeStatus==='all'||(activeStatus==='active'&&st==='active')||st===activeStatus;const text=`${u.email} ${p.name} ${p.threads}`.toLowerCase();return statusOk&&(!q||text.includes(q))});$('memberListHead').textContent=`${users.length}명 표시`;if(!users.length){$('userList').innerHTML='<div class="empty">조건에 맞는 회원이 없습니다</div>';return}
$('userList').innerHTML=users.map(u=>{const p=parseSignupName(u.name),st=effectiveStatus(u),plan=(u.plan||p.plan||'basic').toLowerCase();return `<div class="user-card" data-user="${u.id}"><div class="user-summary"><div class="user-main"><div class="user-email">${u.email}</div><div class="user-name">${p.name||''}${p.threads?` · @${p.threads}`:''}</div><div class="user-sub">${plan==='pro'?'프로':'베이직'} · 하루 ${u.daily_publish_limit}개 · 만료 ${fmt(u.expires_at)}</div></div><div class="summary-right"><span class="badge ${st}">${statusLabel(st)}</span><span class="manage-arrow">관리 ›</span></div></div><div class="user-detail">${u.role==='admin'?'<div class="user-sub">관리자 계정</div>':`<div class="section-label">플랜</div><div class="action-grid"><button class="admin-btn ${plan==='basic'?'primary':''}" data-plan="basic">베이직<br><small>1계정 · 하루 15개</small></button><button class="admin-btn ${plan==='pro'?'primary':''}" data-plan="pro">프로<br><small>2계정 · 하루 ${plan==='pro'?u.daily_publish_limit:50}개</small></button></div><div class="section-label">상태</div><div class="action-row">${u.status==='pending'?'<button class="admin-btn primary" data-act="approve">3일 승인</button>':''}${u.status==='active'?'<button class="admin-btn danger" data-act="suspend">정지</button>':''}${u.status==='suspended'?'<button class="admin-btn primary" data-act="unsuspend">정지 해제</button>':''}</div><div class="section-label">이용기간 조정</div><div class="action-row"><button class="admin-btn" data-days="-30">-30일</button><button class="admin-btn" data-days="-7">-7일</button><button class="admin-btn" data-days="-3">-3일</button><button class="admin-btn" data-days="3">+3일</button><button class="admin-btn" data-days="7">+7일</button><button class="admin-btn" data-days="30">+30일</button></div><div class="action-row" style="margin-top:7px"><input class="day-input" type="number" min="-3650" max="3650" placeholder="예: -10"><button class="admin-btn" data-act="custom-days">직접 적용</button></div><div class="expiry-preview">현재 만료일 ${fmt(u.expires_at)}</div><div class="section-label">비밀번호</div><button class="admin-btn danger" data-act="reset-password">임시 비밀번호로 초기화</button><div class="temp-password" style="display:none"></div>`}</div></div>`}).join('');
document.querySelectorAll('.user-card').forEach(card=>{const id=Number(card.dataset.user);card.querySelector('.user-summary').onclick=()=>card.classList.toggle('open');card.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>applyPlan(id,b.dataset.plan));card.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>adjustDays(id,Number(b.dataset.days)));const act=card.querySelectorAll('[data-act]');act.forEach(b=>b.onclick=async()=>{try{if(b.dataset.act==='approve'){await postJson(`/api/admin/users/${id}/approve`);await adjustDays(id,-27)}else if(b.dataset.act==='suspend'){await postJson(`/api/admin/users/${id}/suspend`);await loadUsers()}else if(b.dataset.act==='unsuspend'){await postJson(`/api/admin/users/${id}/unsuspend`);await loadUsers()}else if(b.dataset.act==='custom-days'){await adjustDays(id,Number(card.querySelector('.day-input').value))}else if(b.dataset.act==='reset-password'){const box=card.querySelector('.temp-password');box.style.display='block';await resetPassword(id,box)}}catch(e){alert(e.message)}})})}
async function loadUsers(){const res=await fetch('/api/admin/users');if(res.status===403){document.body.innerHTML='<p>관리자만 접근할 수 있습니다.</p>';return}allUsers=await res.json();$('statTotal').textContent=allUsers.length;$('statPending').textContent=allUsers.filter(u=>effectiveStatus(u)==='pending').length;$('statActive').textContent=allUsers.filter(u=>effectiveStatus(u)==='active').length;$('statSuspended').textContent=allUsers.filter(u=>['suspended','expired'].includes(effectiveStatus(u))).length;renderUsers()}
document.querySelectorAll('.stat-box').forEach(b=>b.onclick=()=>{activeStatus=b.dataset.status;document.querySelectorAll('.stat-box').forEach(x=>x.classList.toggle('active',x===b));renderUsers()});$('memberSearch').oninput=renderUsers;
document.querySelectorAll('.admin-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));$(`tab-${b.dataset.tab}`).classList.add('active');history.replaceState(null,'',`#${b.dataset.tab}`)});const initial=location.hash.slice(1);if(['members','benchmark','api'].includes(initial))document.querySelector(`.admin-tab[data-tab="${initial}"]`).click();
async function loadSiteSettings(){const r=await fetch('/api/admin/site-settings'),d=await r.json(),f=$('siteSettingsForm');f.price_label.value=d.price_label||'';f.bank_info.value=d.bank_info||'';f.open_kakao_url.value=d.open_kakao_url||'';f.tax_email.value=d.tax_email||'';f.payment_guide.value=d.payment_guide||'';$('recipeImageApiStatus').textContent=`Pexels ${d.has_pexels_api_key?'✓ 저장됨':'✕ 미설정'} · Pixabay ${d.has_pixabay_api_key?'✓ 저장됨':'✕ 미설정'}`}
async function loadSystem(){const r=await fetch('/api/admin/system-api-settings');if(!r.ok)return;const d=await r.json(),f=$('systemApiForm');f.threads_app_id.value=d.threads_app_id||'';f.threads_redirect_uri.value=d.threads_redirect_uri||'';f.naver_client_id.value=d.naver_client_id||'';$('systemApiStatus').textContent=`Threads Secret ${d.has_threads_app_secret?'✓':'✕'} · OpenAI ${d.has_openai_api_key?'✓':'✕'} · YouTube ${d.has_youtube_api_key?'✓':'✕'}`}
$('siteSettingsForm').onsubmit=async e=>{e.preventDefault();const f=e.target;await fetch('/api/admin/site-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price_label:f.price_label.value,bank_info:f.bank_info.value,open_kakao_url:f.open_kakao_url.value,tax_email:f.tax_email.value,payment_guide:f.payment_guide.value})});$('siteSettingsMsg').textContent='저장 완료'};
$('recipeImageApiForm').onsubmit=async e=>{e.preventDefault();const f=e.target,p={};if(f.pexels_api_key.value.trim())p.pexels_api_key=f.pexels_api_key.value.trim();if(f.pixabay_api_key.value.trim())p.pixabay_api_key=f.pixabay_api_key.value.trim();await fetch('/api/admin/site-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});f.reset();$('recipeImageApiMsg').textContent='저장 완료';loadSiteSettings()};
$('systemApiForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const r=await fetch('/api/admin/system-api-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threads_app_id:f.threads_app_id.value,threads_app_secret:f.threads_app_secret.value,threads_redirect_uri:f.threads_redirect_uri.value,openai_api_key:f.openai_api_key.value,naver_client_id:f.naver_client_id.value,naver_client_secret:f.naver_client_secret.value,youtube_api_key:f.youtube_api_key.value})});$('systemApiMsg').textContent=r.ok?'공용 API 설정 저장 완료':'저장 실패';f.threads_app_secret.value='';f.openai_api_key.value='';f.naver_client_secret.value='';f.youtube_api_key.value='';loadSystem()};
loadUsers();loadSiteSettings();loadSystem();
</script>
<script src="benchmarkAdmin.js"></script>
</body></html>

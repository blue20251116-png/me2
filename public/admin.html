<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자</title>
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-top h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
  .stat-box .n { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .stat-box .l { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .user-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .user-email { font-size: 13.5px; font-weight: 600; }
  .user-name { font-size: 11.5px; color: var(--text-dim); }
  .user-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; font-family: var(--font-mono); }
  .user-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .user-actions button { font-size: 11.5px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
  .badge { font-size: 10px; font-family: var(--font-mono); padding: 2px 7px; border-radius: 999px; }
  .badge.pending { color: var(--amber); background: rgba(245,166,35,0.12); }
  .badge.active { color: var(--green); background: rgba(52,211,153,0.12); }
  .badge.suspended { color: var(--red); background: rgba(240,101,90,0.12); }
  .settings-form { display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .settings-form label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--text-dim); }
</style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top">
      <h1>관리자</h1>
      <a href="/" style="color: var(--text-dim); font-size: 12.5px;">← 대시보드로</a>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="n" id="statTotal">–</div><div class="l">전체 회원</div></div>
      <div class="stat-box"><div class="n" id="statPending">–</div><div class="l">승인 대기</div></div>
      <div class="stat-box"><div class="n" id="statActive">–</div><div class="l">활성</div></div>
      <div class="stat-box"><div class="n" id="statSuspended">–</div><div class="l">정지</div></div>
    </div>
    <div id="userList"></div>

    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">서비스 공용 API 설정</h2>
    <form id="systemApiForm" class="settings-form">
      <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 4px;line-height:1.55;">여기에 입력한 값은 모든 회원이 공용으로 사용합니다. Secret/OpenAI 키는 저장 후 다시 화면에 표시하지 않습니다.</p>
      <label>Threads App ID<input type="text" name="threads_app_id" /></label>
      <label>Threads App Secret<input type="password" name="threads_app_secret" placeholder="변경할 때만 입력" /></label>
      <label>Meta Callback / Redirect URI<input type="url" name="threads_redirect_uri" placeholder="https://내도메인/auth/callback" /></label>
      <label>OpenAI API Key<input type="password" name="openai_api_key" placeholder="sk-... (변경할 때만 입력)" /></label>
      <label>네이버 데이터랩 Client ID<input type="text" name="naver_client_id" /></label>
      <label>네이버 데이터랩 Client Secret<input type="password" name="naver_client_secret" placeholder="변경할 때만 입력" /></label>
      <label>YouTube Data API Key<input type="password" name="youtube_api_key" placeholder="Google YouTube Data API Key" /></label>
      <button type="submit" style="align-self:flex-start;font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--amber);color:#1a1300;font-weight:600;cursor:pointer;">공용 API 저장</button>
      <p id="systemApiStatus" style="font-size:12px;color:var(--text-dim);margin:0;"></p>
      <p id="systemApiMsg" style="font-size:12.5px;margin:0;"></p>
    </form>

    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">레시피 이미지 API 설정</h2>
    <form id="recipeImageApiForm" class="settings-form">
      <p style="font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.55;">레시피 사진은 Pexels를 먼저 검색하고, 정확한 사진이 없으면 Pixabay로 자동 재검색합니다. 저장된 키 값은 다시 표시하지 않습니다.</p>
      <label>Pexels API Key
        <input type="password" name="pexels_api_key" placeholder="Pexels API Key 입력" autocomplete="off" />
      </label>
      <label>Pixabay API Key
        <input type="password" name="pixabay_api_key" placeholder="Pixabay API Key 입력" autocomplete="off" />
      </label>
      <button type="submit" style="align-self:flex-start;font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--amber);color:#1a1300;font-weight:600;cursor:pointer;">레시피 이미지 API 저장</button>
      <p id="recipeImageApiStatus" style="font-size:12px;color:var(--text-dim);margin:0;"></p>
      <p id="recipeImageApiMsg" style="font-size:12.5px;margin:0;"></p>
    </form>

    <h2 style="font-family:var(--font-display);font-size:15px;margin:28px 0 10px;">회원가입 화면에 보일 결제 안내</h2>
    <form id="siteSettingsForm" class="settings-form">
      <label>요금 표시<input type="text" name="price_label" /></label>
      <label>입금 계좌<input type="text" name="bank_info" /></label>
      <label>오픈카톡 링크<input type="text" name="open_kakao_url" placeholder="https://open.kakao.com/..." /></label>
      <label>현금영수증 문의 이메일<input type="email" name="tax_email" /></label>
      <label>안내 문구 (회원가입 화면에 그대로 표시됨)<textarea name="payment_guide" rows="4"></textarea></label>
      <button type="submit" style="align-self:flex-start;font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--amber);color:#1a1300;font-weight:600;cursor:pointer;">저장</button>
      <p id="siteSettingsMsg" style="font-size:12.5px;margin:0;"></p>
    </form>
  </div>

  <script>
    function fmt(iso) {
      if (!iso) return '없음';
      return new Date(iso).toLocaleString('ko-KR', { year:'numeric', month:'numeric', day:'numeric' });
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      if (res.status === 403) {
        document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#8a9099;">관리자만 접근할 수 있습니다.</p>';
        return;
      }
      const users = await res.json();
      document.getElementById('statTotal').textContent = users.length;
      document.getElementById('statPending').textContent = users.filter((u) => u.status === 'pending').length;
      document.getElementById('statActive').textContent = users.filter((u) => u.status === 'active').length;
      document.getElementById('statSuspended').textContent = users.filter((u) => u.status === 'suspended').length;

      document.getElementById('userList').innerHTML = users.map((u) => {
        const isExpired = u.expires_at && new Date(u.expires_at) < new Date();
        const badgeStatus = u.status === 'active' && isExpired ? 'suspended' : u.status;
        const badgeLabel = u.status === 'active' && isExpired ? '만료' : { pending:'대기', active:'활성', suspended:'정지' }[u.status];
        return `
          <div class="user-card">
            <div class="user-top">
              <div><span class="user-email">${u.email}</span> <span class="user-name">${u.name || ''}</span></div>
              <span class="badge ${badgeStatus}">${badgeLabel}</span>
            </div>
            <div class="user-meta">가입 ${fmt(u.created_at)} · 승인 ${fmt(u.approved_at)} · 만료 ${fmt(u.expires_at)} · ${u.role === 'admin' ? '관리자' : u.plan}</div>
            <div class="user-actions">
              ${u.status === 'pending' ? `<button data-action="approve" data-id="${u.id}">승인</button>` : ''}
              ${u.status === 'active' ? `<button data-action="suspend" data-id="${u.id}">정지</button>` : ''}
              ${u.status === 'suspended' ? `<button data-action="unsuspend" data-id="${u.id}">정지 해제</button>` : ''}
              ${u.role !== 'admin' ? `<button data-action="grant30" data-id="${u.id}">30일 부여</button>` : ''}
            </div>
          </div>`;
      }).join('');

      document.querySelectorAll('.user-actions button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const routeMap = { approve:'approve', suspend:'suspend', unsuspend:'unsuspend', grant30:'grant' };
          const body = action === 'grant30' ? { days:30 } : undefined;
          await fetch(`/api/admin/users/${id}/${routeMap[action]}`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined,
          });
          loadUsers();
        });
      });
    }

    async function loadSiteSettings() {
      const res = await fetch('/api/admin/site-settings');
      const data = await res.json();
      const form = document.getElementById('siteSettingsForm');
      form.price_label.value = data.price_label || '';
      form.bank_info.value = data.bank_info || '';
      form.open_kakao_url.value = data.open_kakao_url || '';
      form.tax_email.value = data.tax_email || '';
      form.payment_guide.value = data.payment_guide || '';

      const imageForm = document.getElementById('recipeImageApiForm');
      imageForm.pexels_api_key.placeholder = data.has_pexels_api_key ? '저장됨 — 변경할 때만 입력' : 'Pexels API Key 입력';
      imageForm.pixabay_api_key.placeholder = data.has_pixabay_api_key ? '저장됨 — 변경할 때만 입력' : 'Pixabay API Key 입력';
      document.getElementById('recipeImageApiStatus').textContent =
        `Pexels ${data.has_pexels_api_key ? '✓ 저장됨' : '✕ 미설정'} · Pixabay ${data.has_pixabay_api_key ? '✓ 저장됨' : '✕ 미설정'}`;
    }

    document.getElementById('recipeImageApiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('recipeImageApiMsg');
      const payload = {};
      const pexels = form.pexels_api_key.value.trim();
      const pixabay = form.pixabay_api_key.value.trim();
      if (pexels) payload.pexels_api_key = pexels;
      if (pixabay) payload.pixabay_api_key = pixabay;
      if (!Object.keys(payload).length) {
        msg.textContent = '변경할 API Key를 하나 이상 입력해주세요.';
        msg.style.color = 'var(--red)';
        return;
      }
      try {
        const res = await fetch('/api/admin/site-settings', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('저장 실패');
        form.pexels_api_key.value = '';
        form.pixabay_api_key.value = '';
        msg.textContent = '레시피 이미지 API 저장 완료';
        msg.style.color = 'var(--green)';
        loadSiteSettings();
      } catch (err) {
        msg.textContent = '오류: ' + err.message;
        msg.style.color = 'var(--red)';
      }
    });

    document.getElementById('siteSettingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('siteSettingsMsg');
      try {
        const res = await fetch('/api/admin/site-settings', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            price_label:form.price_label.value,
            bank_info:form.bank_info.value,
            open_kakao_url:form.open_kakao_url.value,
            tax_email:form.tax_email.value,
            payment_guide:form.payment_guide.value,
          }),
        });
        if (!res.ok) throw new Error('저장 실패');
        msg.textContent = '저장 완료 — 회원가입 화면에 바로 반영됩니다';
        msg.style.color = 'var(--green)';
      } catch (err) {
        msg.textContent = '오류: ' + err.message;
        msg.style.color = 'var(--red)';
      }
    });

    async function loadSystemApiSettings() {
      const res = await fetch('/api/admin/system-api-settings');
      if (!res.ok) return;
      const data = await res.json();
      const form = document.getElementById('systemApiForm');
      form.threads_app_id.value = data.threads_app_id || '';
      form.threads_redirect_uri.value = data.threads_redirect_uri || '';
      form.naver_client_id.value = data.naver_client_id || '';
      form.threads_app_secret.placeholder = data.has_threads_app_secret ? '저장됨 — 변경할 때만 입력' : '변경할 때만 입력';
      form.openai_api_key.placeholder = data.has_openai_api_key ? '저장됨 — 변경할 때만 입력' : 'sk-...';
      form.naver_client_secret.placeholder = data.has_naver_client_secret ? '저장됨 — 변경할 때만 입력' : '변경할 때만 입력';
      form.youtube_api_key.placeholder = data.has_youtube_api_key ? '저장됨 — 변경할 때만 입력' : 'Google YouTube Data API Key';
      document.getElementById('systemApiStatus').textContent =
        `Threads Secret ${data.has_threads_app_secret ? '✓' : '✕'} · OpenAI ${data.has_openai_api_key ? '✓' : '✕'} · Naver Secret ${data.has_naver_client_secret ? '✓' : '✕'} · YouTube ${data.has_youtube_api_key ? '✓' : '✕'}`;
    }

    document.getElementById('systemApiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target, msg = document.getElementById('systemApiMsg');
      try {
        const res = await fetch('/api/admin/system-api-settings', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            threads_app_id:form.threads_app_id.value,
            threads_app_secret:form.threads_app_secret.value,
            threads_redirect_uri:form.threads_redirect_uri.value,
            openai_api_key:form.openai_api_key.value,
            naver_client_id:form.naver_client_id.value,
            naver_client_secret:form.naver_client_secret.value,
            youtube_api_key:form.youtube_api_key.value,
          }),
        });
        if (!res.ok) throw new Error((await res.json()).error || '저장 실패');
        form.threads_app_secret.value = '';
        form.openai_api_key.value = '';
        form.naver_client_secret.value = '';
        form.youtube_api_key.value = '';
        msg.textContent = '공용 API 설정 저장 완료';
        msg.style.color = 'var(--green)';
        loadSystemApiSettings();
      } catch (err) {
        msg.textContent = '오류: ' + err.message;
        msg.style.color = 'var(--red)';
      }
    });

    loadUsers();
    loadSiteSettings();
    loadSystemApiSettings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>최초 관리자 설정</title>
<link rel="stylesheet" href="style.css" />
<style>
  .auth-shell { max-width: 420px; margin: 0 auto; min-height: 100dvh; display:flex; flex-direction:column; justify-content:center; padding:24px; }
  .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 24px; }
  .auth-card form { display:flex; flex-direction:column; gap:12px; }
  .hint { font-size:12.5px; color:var(--text-dim); line-height:1.6; }
</style>
</head>
<body style="margin:0;background:var(--bg);">
<div class="auth-shell"><div class="auth-card">
  <h1 style="margin-top:0;">최초 관리자 설정</h1>
  <p class="hint">관리자 계정이 아직 없는 경우에만 한 번 사용할 수 있습니다. 생성 후 이 설정 기능은 자동으로 잠깁니다.</p>
  <form id="setupForm">
    <label>관리자 이름<input type="text" name="name" value="관리자" /></label>
    <label>관리자 이메일<input type="email" name="email" required /></label>
    <label>관리자 비밀번호<input type="password" name="password" minlength="8" required placeholder="8자 이상" /></label>
    <button class="btn-primary" type="submit">관리자 만들기</button>
  </form>
  <p id="msg" class="msg"></p>
</div></div>
<script>
(async () => {
  try {
    const r = await fetch('/api/auth/admin-setup-status');
    const d = await r.json();
    if (!d.needsSetup) location.href = '/login.html';
  } catch {}
})();
document.getElementById('setupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, msg = document.getElementById('msg');
  try {
    const r = await fetch('/api/auth/setup-admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:f.name.value,email:f.email.value,password:f.password.value}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '관리자 생성 실패');
    location.href = '/admin';
  } catch (err) { msg.textContent = err.message; msg.className='msg error'; }
});
</script>
</body>
</html>
